<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUS XPERIENCE</title>
<link rel="icon" type="image/png" href="/medias/favicon-mobilitylab.png">
<link rel="apple-touch-icon" href="/medias/favicon-mobilitylab-180.png">
<link rel="stylesheet" href="https://fonts.post.ch/swiss-post-sans/v1/swiss-post-sans.css">
<style>
:root{
 --yellow:#ffcc00;--black:#08090b;--ink:#111216;--paper:#f7f4ed;
 --white:#fff;--muted:#8a8a86;--line:#303136;--red:#e30613;--orange:#ff6a13;
}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--black);color:var(--paper);font-family:"Swiss Post Sans",Arial,system-ui,sans-serif;
 touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Le lien "Protection des données" reste un vrai lien: on lui laisse son
   comportement tactile normal (ouverture, appui long = menu du navigateur). */
.privacy-card{touch-action:manipulation;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
button{font:inherit}
[hidden]{display:none!important}

/* Cadre borne */
#progress{position:fixed;left:clamp(28px,6vw,96px);right:clamp(28px,6vw,96px);top:20px;z-index:20;display:none}
#progress-line{display:flex;justify-content:space-between;align-items:center;gap:24px;font-size:clamp(13px,1.3vw,19px);font-weight:800}
#progress-step{color:var(--yellow)}
#progress-count{color:var(--paper);font-variant-numeric:tabular-nums}
#progress-track{height:8px;margin-top:10px;border-radius:99px;background:#27282d;overflow:hidden}
#progress-fill{display:block;height:100%;width:0;background:var(--yellow);transition:width .35s ease}
#signature{position:fixed;right:clamp(24px,5vw,78px);bottom:15px;z-index:15;color:#5b5c61;font-size:clamp(11px,1.1vw,16px);font-weight:600}
/* Scrim: garantit que le bandeau d'instruction du buzzer reste toujours
   lisible et "propre" même quand le contenu de l'écran (beaucoup de choix,
   question longue) s'approche du bas — sans ce fondu, les deux pouvaient se
   toucher sans transition nette. */
#chrome-scrim{position:fixed;left:0;right:0;bottom:0;height:clamp(90px,14vh,150px);background:linear-gradient(to top,var(--black) 0%,rgba(8,9,11,0) 100%);z-index:16;display:none;pointer-events:none}
#interaction{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:18;display:none;flex-direction:column;align-items:center;gap:8px}
#interaction-row{display:flex;align-items:center;gap:12px;color:var(--paper);font-size:clamp(12px,1.1vw,16px);font-weight:800;white-space:nowrap}
#interaction-dot{width:20px;height:20px;border-radius:50%;background:var(--red);box-shadow:0 5px 0 #75050a;transition:transform .1s,box-shadow .1s}
#interaction-dot.arming{transform:scale(1.18);box-shadow:0 5px 0 #75050a,0 0 0 6px rgba(227,6,19,.25)}
#press-meter{width:min(260px,42vw);height:6px;border-radius:99px;background:#27282d;overflow:hidden;opacity:0;transition:opacity .15s}
#press-meter.on{opacity:1}
#press-meter i{display:block;height:100%;width:0%;background:var(--yellow);border-radius:99px}
#press-meter.ready i{background:var(--red)}

.screen{position:absolute;inset:0;display:none;overflow:hidden;padding:clamp(86px,11vh,120px) clamp(28px,7vw,112px) clamp(78px,12vh,112px)}
.screen.active{display:flex}
.screen.center{align-items:center;justify-content:center;text-align:center}
.screen.question-layout{flex-direction:column;justify-content:center;align-items:center;gap:clamp(26px,4.5vh,48px)}
.eyebrow{color:var(--yellow);font-size:clamp(14px,1.4vw,20px);font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.eyebrow.brand{display:inline-flex;align-items:center;gap:.55em}
.eyebrow.brand img{height:1em;width:auto;display:block;flex:0 0 auto}
.headline{font-size:clamp(44px,6vw,92px);line-height:.9;letter-spacing:-.055em;font-weight:900;text-transform:uppercase;text-wrap:balance}
.question{font-size:clamp(30px,3.6vw,52px);line-height:1.04;letter-spacing:-.03em;font-weight:900;max-width:18ch;text-wrap:balance}
.question.compact{font-size:clamp(25px,3vw,42px);max-width:24ch}
.lead{font-size:clamp(19px,1.9vw,28px);line-height:1.25;font-weight:700;max-width:58ch;text-wrap:balance}
.muted{color:var(--muted)}

/* Transition */
#wipe{position:fixed;inset:0;z-index:100;background:var(--yellow);transform:translateX(-102%);pointer-events:none}
#wipe.go{animation:wipe .52s cubic-bezier(.72,0,.2,1)}
@keyframes wipe{0%{transform:translateX(-102%)}45%,55%{transform:translateX(0)}100%{transform:translateX(102%)}}

/* Buzzer principal */
.buzzer{width:clamp(150px,20vh,225px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;position:relative;background:radial-gradient(circle at 32% 24%,#ff7b82 0,#ef1b25 26%,var(--red) 52%,#8d020a 100%);box-shadow:0 clamp(18px,2.5vh,28px) 0 #6e0309,0 35px 55px rgba(0,0,0,.55),inset 0 -18px 28px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.buzzer:after{content:"";position:absolute;left:17%;top:11%;width:43%;height:24%;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(5px)}
.buzzer.pressed{transform:translateY(15px);box-shadow:0 5px 0 #6e0309,0 18px 30px rgba(0,0,0,.5),inset 0 -10px 20px rgba(0,0,0,.35)}

/* Sélections pilotées par un seul buzzer */
.choices{display:grid;grid-template-columns:1fr;width:min(880px,82vw);gap:clamp(8px,1.1vh,12px);min-height:0;align-content:center}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{min-height:clamp(48px,6.6vh,68px);padding:clamp(9px,1.4vh,15px) clamp(14px,1.7vw,24px);display:flex;align-items:center;gap:16px;border:2px solid var(--line);border-radius:14px;background:#17181c;color:var(--paper);font-size:clamp(15px,1.55vw,21px);line-height:1.1;font-weight:800;text-align:left;transition:transform .14s,border-color .14s,background .14s,color .14s;cursor:pointer;position:relative;overflow:hidden;isolation:isolate}
.choice .number,.choice>span:last-child{position:relative;z-index:1}
.choice .hold-fill{position:absolute;inset:0;width:0%;background:rgba(255,255,255,.3);z-index:0;transition:width .06s linear}
.choice.selected .hold-fill{background:rgba(0,0,0,.16)}
.choice .number{display:grid;place-items:center;flex:0 0 auto;width:clamp(28px,2.7vw,38px);height:clamp(28px,2.7vw,38px);border-radius:8px;background:#2a2b31;color:var(--paper);font-size:.78em;font-variant-numeric:tabular-nums}
.choice.selected{background:var(--yellow);color:var(--ink);border-color:var(--yellow);transform:translateX(9px)}
.choice.selected .number{background:var(--ink);color:var(--yellow)}
.choice.confirmed{background:var(--orange);border-color:var(--orange);color:#fff}
.choice.confirmed .number{background:#fff;color:var(--orange)}
.choices.many .choice{min-height:clamp(42px,5.6vh,54px);font-size:clamp(13px,1.25vw,17px);padding:8px 14px}
/* 6 à 8 réponses: grille équilibrée à deux colonnes; jamais une dernière
   réponse isolée seule dans sa ligne (elle s'étire alors sur toute la largeur). */
.choices.two.many .choice:last-child:nth-child(odd){grid-column:1 / -1}

/* Langue / consentement */
.hero-stack{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3vh,34px);width:min(1200px,90vw)}
.language-title{font-size:clamp(50px,6.8vw,98px);font-weight:900;letter-spacing:-.05em;line-height:.88}
#intro-title{max-width:20ch;font-size:clamp(38px,4.5vw,64px);line-height:.92}
#e-intro .hero-stack{gap:clamp(12px,2vh,22px)}
#participant-code-line{color:#6f6d66;font-size:clamp(11px,1.05vw,14px);font-weight:650;line-height:1.4}
#participant-code-line b{display:block;margin-top:5px;color:var(--ink);font-size:clamp(19px,2vw,26px);font-weight:900;letter-spacing:.02em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* Consentement: composition éditoriale sur deux zones, toute la largeur */
#e-consent{align-items:center}
.consent-grid{display:grid;grid-template-columns:1.05fr .95fr;column-gap:clamp(36px,5vw,84px);row-gap:22px;width:min(1500px,94vw);align-items:center}
.consent-left{display:flex;flex-direction:column;gap:clamp(14px,2.2vh,24px)}
.consent-right{display:flex;flex-direction:column;gap:clamp(16px,2.4vh,26px)}
#consent-copy{white-space:pre-line;max-width:56ch;color:var(--paper);font-size:clamp(16px,1.5vw,21px);line-height:1.34;font-weight:600}
#consent-choices{width:100%;margin:0}
.privacy-card{display:flex;align-items:center;gap:16px;padding:14px 18px;border:2px solid var(--line);border-radius:16px;background:#141519;text-decoration:none;transition:border-color .14s,background .14s,transform .14s}
.privacy-card:hover,.privacy-card:focus-visible{border-color:var(--yellow);background:#1b1c21;transform:translateY(-2px)}
#consent-qr{flex:0 0 auto;width:clamp(96px,9vh,112px);height:clamp(96px,9vh,112px);background:#fff;border-radius:10px;padding:6px}
.privacy-card-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.privacy-card-text b{color:var(--paper);font-size:clamp(14px,1.3vw,17px);font-weight:900;letter-spacing:-.01em}
.privacy-card-text span{color:var(--muted);font-size:clamp(12.5px,1.15vw,16px);font-weight:600;line-height:1.3}
@media (max-width:980px){
 .consent-grid{grid-template-columns:1fr;width:min(760px,92vw)}
 #consent-copy{max-width:none}
}

/* Étoiles */
.stars{display:flex;align-items:center;gap:clamp(8px,1.7vw,22px);min-height:110px}
.star{font-size:clamp(52px,7vw,96px);line-height:1;color:#2a2b31;transition:color .14s,transform .14s}
.star.on{color:var(--yellow);transform:translateY(-5px)}
.value-badge{display:inline-flex;align-items:baseline;gap:10px;background:var(--yellow);color:var(--ink);border-radius:12px;padding:8px 15px;font-size:clamp(17px,2vw,27px);font-weight:900}

/* Échelle sans curseur */
.scale-wrap{width:min(960px,84vw);display:flex;flex-direction:column;gap:16px}
.scale-values{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:clamp(4px,.6vw,9px)}
.scale-value{height:clamp(42px,6.4vw,74px);display:grid;place-items:center;border:2px solid var(--line);border-radius:11px;background:#17181c;color:var(--paper);font-size:clamp(15px,1.8vw,25px);font-weight:900;transition:.14s}
.scale-value.selected{background:var(--yellow);border-color:var(--yellow);color:var(--ink);transform:translateY(-7px)}
.scale-labels{display:flex;justify-content:space-between;gap:24px;color:var(--muted);font-size:clamp(12px,1.15vw,16px);font-weight:750}
.scale-labels span{max-width:18ch}
.scale-labels span:last-child{text-align:right}

/* Duel */
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:clamp(14px,2.1vw,28px);width:min(940px,84vw)}
.duel-card{min-height:clamp(120px,20vh,210px);display:grid;place-items:center;padding:24px;border:3px solid var(--line);border-radius:18px;background:#17181c;color:var(--paper);font-size:clamp(19px,2.15vw,30px);line-height:1.08;font-weight:900;text-align:center;transition:.14s}
.duel-card.selected{background:var(--yellow);border-color:var(--yellow);color:var(--ink);transform:translateY(-9px)}
.duel-or{align-self:center;color:var(--muted);font-size:clamp(15px,1.4vw,19px);font-weight:900}

/* Concept */
.concept-subtitle{color:var(--paper);opacity:.8;font-size:clamp(14px,1.3vw,18px);font-weight:650;margin-top:-6px}
.concept-card{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(220px,.75fr);gap:clamp(20px,3.4vw,46px);width:min(980px,84vw);max-height:52vh;padding:clamp(20px,3.4vh,36px);border-radius:22px;background:var(--paper);color:var(--ink);box-shadow:16px 16px 0 var(--yellow)}
.concept-card.no-image{grid-template-columns:1fr}
.concept-card.no-image h2{font-size:clamp(32px,4.4vw,58px);max-width:16ch}
.concept-card.no-image p{max-width:52ch}
.concept-card h2{font-size:clamp(28px,3.6vw,48px);line-height:1;letter-spacing:-.03em;font-weight:900;text-wrap:balance}
.concept-card p{margin-top:14px;font-size:clamp(16px,1.6vw,21px);line-height:1.25;font-weight:650;max-width:48ch}
.concept-visual{width:100%;height:100%;display:flex}
.concept-card img{width:100%;height:100%;max-height:36vh;object-fit:cover;border-radius:13px}
.concept-icon{width:100%;height:100%;min-height:150px;max-height:36vh;display:flex;align-items:center;justify-content:center;gap:.15em;font-size:clamp(40px,5.4vw,66px);background:var(--yellow);border-radius:13px}

/* Réactions (remplace les étoiles pour "cette idée te plairait-elle ?") */
.reactions{display:flex;justify-content:center;align-items:stretch;gap:clamp(8px,1.6vw,20px);flex-wrap:wrap;width:min(940px,86vw)}
.reaction{flex:1 1 0;min-width:98px;max-width:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:clamp(13px,2.4vh,24px) 8px;border:2px solid var(--line);border-radius:17px;background:#17181c;color:var(--paper);cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:transform .14s,border-color .14s,background .14s,color .14s}
.reaction .hold-fill{position:absolute;inset:0;width:0%;background:rgba(255,255,255,.3);z-index:0;transition:width .06s linear}
.reaction.selected .hold-fill{background:rgba(0,0,0,.16)}
.reaction-emoji{font-size:clamp(30px,3.9vw,44px);line-height:1;position:relative;z-index:1}
.reaction-label{font-size:clamp(11px,1.05vw,14px);font-weight:800;text-align:center;position:relative;z-index:1}
.reaction.selected{background:var(--yellow);border-color:var(--yellow);color:var(--ink);transform:translateY(-9px)}

/* Voix */
.voice-area{display:flex;flex-direction:column;gap:clamp(14px,2.2vh,26px);align-items:flex-start;width:min(880px,84vw)}
.meter{display:flex;align-items:flex-end;gap:9px;height:84px}
.meter i{width:15px;height:14%;border-radius:9px;background:var(--yellow)}
.timer{display:inline-flex;background:var(--paper);color:var(--ink);padding:7px 16px;border-radius:99px;font-size:clamp(16px,1.6vw,23px);font-weight:900;font-variant-numeric:tabular-nums}
.voice-status{font-size:clamp(16px,1.5vw,21px);font-weight:800;color:var(--paper)}

/* Rapport — mise en page « billet de voyage »: corps éditorial à gauche,
   souche façon ticket à droite (code de participation mis en avant, il est
   la preuve la plus concrète du caractère personnalisé du profil). */
#e-report{background:var(--yellow);color:var(--ink)}
#report-loading{font-size:clamp(28px,3.5vw,54px);font-weight:900;text-align:center;max-width:30ch}
.report-card{width:min(1040px,88vw);max-height:86vh;background:var(--paper);border-radius:20px;box-shadow:16px 16px 0 var(--ink);text-align:left;opacity:0;transform:translateY(40px) scale(.96);display:grid;grid-template-columns:1fr minmax(170px,210px);overflow:hidden;position:relative}
.report-card.reveal{animation:reveal .55s cubic-bezier(.2,1.2,.25,1) forwards}
@keyframes reveal{to{opacity:1;transform:none}}
.report-main{position:relative;z-index:1;min-width:0;padding:clamp(20px,3.2vh,36px) clamp(18px,2.6vw,26px) clamp(20px,3.2vh,36px) clamp(20px,3.4vh,36px);overflow-y:auto}
.report-kicker{font-size:clamp(11px,1.1vw,15px);letter-spacing:.22em;text-transform:uppercase;color:#74736d;font-weight:900}
.report-title{margin-top:8px;font-size:clamp(28px,3.8vw,50px);line-height:1;letter-spacing:-.035em;text-transform:uppercase;font-weight:900;max-width:17ch}
.report-body{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,2.6vw,34px);margin-top:clamp(12px,2vh,20px);font-size:clamp(13.5px,1.3vw,17px);line-height:1.32;font-weight:600}
.report-conclusion{position:relative;display:inline-block;margin-top:clamp(12px,2vh,20px);padding:10px 16px 10px 32px;background:var(--ink);color:var(--yellow);border-radius:9px;font-size:clamp(13.5px,1.35vw,18px);line-height:1.24;font-weight:900}
.report-conclusion:before{content:"\201C";position:absolute;left:10px;top:.02em;font-size:1.5em;font-weight:900;opacity:.5;line-height:1}
.report-thanks{margin-top:clamp(10px,1.6vh,16px);color:#5f5d57;font-size:clamp(11.5px,1.05vw,14px);font-weight:650;font-style:italic;max-width:52ch}
.report-stub{position:relative;z-index:1;background:#efe8d6;border-left:2px dashed rgba(17,18,22,.22);padding:clamp(18px,3vh,32px) clamp(16px,2vw,24px);display:flex;flex-direction:column;gap:14px}
.report-stub-icon{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:var(--yellow)}
.report-stub-icon img{width:100%;height:100%;object-fit:cover;display:block}
.report-stub-fields{display:flex;flex-direction:column;gap:11px;flex:1}
.report-stub-field{color:#6f6d66;font-size:clamp(10px,.95vw,12.5px);font-weight:650;line-height:1.35}
.report-stub-field b{display:block;margin-top:2px;color:var(--ink);font-size:clamp(13px,1.3vw,16px);font-weight:800}
.report-stub-footer{display:flex;flex-direction:column;gap:12px}
.report-barcode{height:26px;border-radius:3px;opacity:.8;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 13px,transparent 13px 15px,var(--ink) 15px 18px,transparent 18px 23px,var(--ink) 23px 24px,transparent 24px 28px)}
.report-label{color:#8b887f;font-size:clamp(10px,.95vw,12.5px);font-weight:650}
.report-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.report-confetti i{position:absolute;top:-18px;width:8px;height:14px;opacity:0;border-radius:2px}
.report-confetti i:nth-child(1){left:6%;background:var(--yellow);animation-delay:.05s}
.report-confetti i:nth-child(2){left:16%;background:var(--ink);animation-delay:.16s}
.report-confetti i:nth-child(3){left:27%;background:var(--yellow);animation-delay:0s}
.report-confetti i:nth-child(4){left:39%;background:var(--red);animation-delay:.22s}
.report-confetti i:nth-child(5){left:52%;background:var(--ink);animation-delay:.1s}
.report-confetti i:nth-child(6){left:63%;background:var(--yellow);animation-delay:.28s}
.report-confetti i:nth-child(7){left:74%;background:var(--ink);animation-delay:.04s}
.report-confetti i:nth-child(8){left:83%;background:var(--red);animation-delay:.19s}
.report-confetti i:nth-child(9){left:91%;background:var(--yellow);animation-delay:.13s}
.report-confetti i:nth-child(10){left:97%;background:var(--ink);animation-delay:.24s}
.report-card.reveal .report-confetti i{animation:confetti-fall 1.15s cubic-bezier(.35,0,.65,1) forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(340px) rotate(320deg);opacity:0}}

/* Animation des titres */
.word{display:inline-block;opacity:0;transform:translateY(.35em)}
.play .word{animation:rise .35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* Hiérarchie d'apparition: la question se lit d'abord (animation par mot
   ci-dessus), les réponses n'arrivent qu'ensuite — jamais les deux d'un
   bloc, qui donnait l'impression que tout arrivait en même temps, trop
   brutalement. */
.choices,.stars,.scale-wrap,.duel,.concept-card,.reactions,.voice-area{opacity:0;transform:translateY(10px)}
.play .choices,.play .stars,.play .scale-wrap,.play .duel,.play .concept-card,.play .reactions,.play .voice-area{animation:answerRise .4s cubic-bezier(.2,.8,.2,1) .32s forwards}
@keyframes answerRise{to{opacity:1;transform:none}}

@media (max-height:780px){
 .screen{padding-top:74px;padding-bottom:92px}
 .question-layout{gap:18px}
 .question{font-size:clamp(26px,3.2vw,42px)}
 .choice{min-height:46px;padding:8px 13px}
 .choices.many .choice{min-height:40px}
 .concept-card{max-height:55vh;padding:20px}
 .report-card{max-height:90vh}
 .report-main{padding:20px 18px 20px 22px}
 .report-stub{padding:18px 18px}
 .report-body{font-size:clamp(13px,1.2vw,16px)}
}
@media (max-width:900px){
 .choices.two{grid-template-columns:1fr}
 .choices.many{grid-template-columns:repeat(2,minmax(0,1fr))}
 .duel{grid-template-columns:1fr 1fr}.duel-or{display:none}
 .concept-card{grid-template-columns:1fr}
 .concept-visual{order:-1;max-height:150px}
 .concept-card img,.concept-icon{max-height:150px;min-height:0}
 .report-card{grid-template-columns:1fr;max-height:none;overflow-y:auto}
 .report-main{overflow-y:visible}

 const t=conceptTexte(c);
 if(/signal|problème|sécurité|meld|sicherheit|gefahr/.test(t))return"securite";

 if(/correspondance|retard|attend|prévenu|garantie|anschluss|verspätung|informiert|garantie/.test(t))return"confiance";
 if(/billet|tarif|prix|itinéraire|route|kilomètre|départ|véhicule|chercher|billett|preis|kilometer|abfahrt|fahrzeug|abholen/.test(t))return"utilite";
 return"agreable";
}

   Les voix "Enhanced/Premium" (téléchargées par l'utilisateur) ou "Siri"
   sont nettement meilleures et doivent être préférées quand disponibles. */
function voiceScore(v){const n=v.name.toLowerCase();return (n.includes("natural")?8:0)+(n.includes("online")?5:0)+(n.includes("neural")?5:0)+(n.includes("google")?3:0)+(n.includes("siri")?7:0)+(n.includes("enhanced")?6:0)+(n.includes("premium")?6:0)+(!v.localService?2:0)}
function browserVoice(){if(voiceCache[lang])return voiceCache[lang];const list=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(lang));if(!list.length)return null;const pref=(cfg.tts&&cfg.tts["voix_"+lang])||"auto";voiceCache[lang]=(pref!=="auto"&&list.find(v=>v.name===pref))||list.sort((a,b)=>voiceScore(b)-voiceScore(a))[0];return voiceCache[lang]}

/* iOS/Safari a un bug WebKit connu: enchaîner cancel() puis speak() dans le
   même tick fait parfois disparaître silencieusement le nouvel énoncé (ni
   onstart, ni onend, ni erreur — juste rien ne se dit), ce qui explique
   des questions "sautées" sans schéma évident. On ne cancel() que si une
   lecture est vraiment en cours, et on laisse un court délai avant de
   relancer speak() pour laisser le moteur vocal se réinitialiser. resume()
   avant chaque lecture récupère aussi les cas où Safari met la synthèse en
   pause toute seule après un moment d'inactivité. */

function speakQuestion(q,done){stopSpeech();const spoken=(q["parle_"+lang]||"").trim()||(q.displayText||q[lang]||q.fr||"");const file=q["audio_"+lang];if(file){musicDuck();questionAudio=new Audio("/voix/"+file);questionAudio.onended=()=>{musicNormal();done&&done()};questionAudio.play().catch(()=>speak(spoken,done))}else speak(spoken,done)}

function conditionsHide(step){if(step.kind!=="question"||!step.q.condition)return false;const c=step.q.condition,ref=(cfg.questions||[]).find(q=>q.ordre===c.question_ordre||q.id===c.question_id);if(!ref)return false;const value=localAnswers["q"+ref.id],matches=value!=null&&(c.valeurs||[]).includes(value);return c.regle==="seulement_si"?!matches:matches}

/* Choix génériques */
/* Les cartes de choix sont purement visuelles: sur mobile/tactile comme au

/* Parcours */
function showStep(delta=1){clearTimers();stopSpeech();let next=stepIndex+delta;while(next<sequence.length&&conditionsHide(sequence[next]))next+=delta>=0?1:-1;stepIndex=Math.max(0,next);if(stepIndex>=sequence.length)return finish();if(stepIndex===0&&!firstQuestionExplained){pendingFirstHint=true;firstQuestionExplained=true}const step=sequence[stepIndex];updateProgress(step);if(step.kind==="question")showQuestion(step.q);else if(step.kind==="concept")showConcept(step.c);else if(step.kind==="concept-impact")showReaction(step.c);else showScale({id:0,concept:step.c,[lang]:lang==="de"?"Würdest du damit öfter den Bus nehmen?":"Avec cette idée, prendrais-tu le bus plus souvent ?",params:{max:10,min_libelle_fr:"Pas du tout",max_libelle_fr:"Certainement",min_libelle_de:"Gar nicht",max_libelle_de:"Ganz sicher"},key:"adoption"})}

function showConcept(c){state="concept";const total=(cfg.concepts||[]).length,idx=(cfg.concepts||[]).indexOf(c)+1;$("#concept-kicker").textContent=text().innovation(idx||1,total||1);$("#concept-subtitle").textContent=text().conceptSubtitle;$("#concept-title").textContent=lang==="de"?c.nom_de:c.nom_fr;$("#concept-description").textContent=lang==="de"?c.desc_de:c.desc_fr;const img=$("#concept-image"),iconEl=$("#concept-icon"),card=$("#concept-card"),manuel=c.icone&&c.icone.trim();
/* Pas de photo et pas de picto choisi par l'admin: on n'invente plus une

/* Réaction: remplace les étoiles pour "cette idée te plairait-elle ?". La

let currentReaction=1;
function showReaction(concept){
 const cat=conceptCategorie(concept),def=REACTIONS[lang][cat];
 const q={id:0,concept,[lang]:def.question,parle_fr:def.question,parle_de:def.question,displayText:def.question};
 state="reaction";currentQuestion=q;currentReaction=1;

  zone.appendChild(b);

}

/* Question vocale: le microphone a déjà été autorisé au consentement.
   Il n'existe aucun autre chemin possible: si l'accès échoue ici, la
   session est supprimée et le message "microphone indisponible" s'affiche. */
let recorder=null,chunks=[],lastBlob=null,voiceStream=null,voiceContext=null,voiceDeadline=0,voiceQuestion=null;
/* La coupure "dure" de la musique (musicHardMuted+pause) ne démarre qu'à
   startRecording(), pas ici: le micro n'est pas encore actif tant qu'on
   n'a pas appuyé, la lecture de la question reste seulement "duckée" comme
   avant (musicDuck() normal, déjà fiable partout). Coupler pause()/play()
   de la musique de fond avec speechSynthesis.speak() au même instant s'est
   avéré source d'échecs silencieux de la lecture vocale sur iPhone (bug
   connu de WebKit: les deux se disputent la même session audio système). */
function showVoice(q){voiceQuestion=q;state="voice-intro";fitQuestion($("#voice-question"),q.displayText);$("#voice-meter").hidden=true;$("#voice-timer").hidden=true;$("#voice-review").hidden=true;$("#voice-status").textContent=text().recordStart;show("e-voice");setHelp(text().press);speakQuestion(q)}
async function startRecording(){stopSpeech();let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch{await abandonnerSession();return showMicUnavailable()}voiceStream=stream;musicHardMuted=true;musicMute();chunks=[];lastBlob=null;try{recorder=new MediaRecorder(stream,{mimeType:"audio/webm"})}catch{recorder=new MediaRecorder(stream)}recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start();state="voice-recording";voiceDeadline=Date.now()+(((voiceQuestion.params||{}).duree_voix)||45)*1000;$("#voice-meter").hidden=false;$("#voice-timer").hidden=false;$("#voice-status").textContent=text().recording;setHelp(text().press);startMeter(stream);updateTimer()}
function updateTimer(){if(state!=="voice-recording")return;const seconds=Math.max(0,Math.ceil((voiceDeadline-Date.now())/1000));$("#voice-timer").textContent=`0:${String(seconds).padStart(2,"0")}`;if(seconds<=0)return stopRecording();later(250,updateTimer)}
function startMeter(stream){try{voiceContext=new (window.AudioContext||window.webkitAudioContext)();const analyser=voiceContext.createAnalyser();voiceContext.createMediaStreamSource(stream).connect(analyser);analyser.fftSize=128;const data=new Uint8Array(analyser.frequencyBinCount),bars=[...document.querySelectorAll("#voice-meter i")];(function loop(){if(state!=="voice-recording"){voiceContext&&voiceContext.close();return}analyser.getByteFrequencyData(data);bars.forEach((b,i)=>b.style.height=Math.max(14,(data[i*3]||0)/255*100)+"%");requestAnimationFrame(loop)})()}catch{}}
async function stopRecording(){if(state!=="voice-recording")return;state="voice-review";clearTimers();if(recorder&&recorder.state!=="inactive")await new Promise(resolve=>{recorder.onstop=resolve;recorder.stop()});voiceStream&&voiceStream.getTracks().forEach(t=>t.stop());musicHardMuted=false;musicNormal();lastBlob=new Blob(chunks,{type:"audio/webm"});$("#voice-meter").hidden=true;$("#voice-timer").hidden=true;$("#voice-status").textContent=text().review;$("#voice-listen").textContent=text().listen;$("#voice-redo").textContent=text().redo;$("#voice-save").textContent=text().save;$("#voice-review").hidden=false;selection=2;refreshSelection("#voice-review .choice");setHelpChoose()}
function reviewAction(){if(selection===0){if(lastBlob)new Audio(URL.createObjectURL(lastBlob)).play();return}if(selection===1){state="voice-intro";$("#voice-review").hidden=true;$("#voice-status").textContent=text().recordStart;setHelp(text().press);return}saveVoice()}
async function saveVoice(){if(!lastBlob)return soundError();state="sending";soundOk();await send({question_id:voiceQuestion.id,cle:"reponse",valeur:"[voix]",audio:lastBlob});later(260,()=>showStep())}

/* Rapport */
async function finish(){state="report";clearTimers();stopSpeech();hideChrome();if(!demo){try{await fetch(`/api/sessions/${session}/terminer`,{method:"POST"})}catch{}}$("#report-card").hidden=true;$("#report-card").classList.remove("reveal");show("e-report");const messages=text().calc;let i=0;$("#report-loading").textContent=messages[0];const rot=setInterval(()=>{$("#report-loading").textContent=messages[++i%messages.length]},1250);let doc;
/* Le délai minimum d'affichage tourne EN PARALLÈLE de la génération réelle
   (Promise.all), pas en plus: sinon un fournisseur IA plus lent que
   d'habitude rendait l'écran final visiblement long à charger (délai fixe +
   temps réseau réel, cumulés). Le minimum garde juste le temps que

   prêt plus vite. */
if(demo){
 const attente=new Promise(r=>setTimeout(r,1300));
 doc={titre:lang==="de"?"EINFACH EINSTEIGEN, BESSER ANKOMMEN":"MONTER SIMPLEMENT, ARRIVER MIEUX",texte:lang==="de"?"Der Bus und du: Die Beziehung hat Potenzial. Heute lief alles im Demo-Modus, ohne gespeicherte Antworten.\n\nKlar ist trotzdem: weniger Rätsel, verlässliche Informationen und ein Erlebnis, das sich von Anfang an einfach anfühlt.\n\nDein Fazit: Der beste Bus ist der, der mitdenkt.":"Le bus et toi, la relation a du potentiel. Aujourd’hui, tout s’est déroulé en mode démo, sans réponse enregistrée.\n\nUne chose reste claire : moins de mystère, des informations fiables et une expérience simple dès le départ.\n\nTon verdict : le meilleur bus est celui qui pense au voyageur.",label:lang==="de"?"Demo · nichts gespeichert":"Démo · rien d’enregistré"};
 await attente;
}else{
 const fd=new FormData();fd.set("lang",lang);
 const [resultat]=await Promise.all([
  fetch(`/api/sessions/${session}/rapport`,{method:"POST",body:fd}).then(r=>r.json()).catch(()=>null),
  new Promise(r=>setTimeout(r,1300))
 ]);
 doc=resultat;
}
clearInterval(rot);$("#report-loading").textContent="";if(!doc)doc={titre:"BUS XPERIENCE",texte:text().noThanks,label:""};const lieuNom=cfg.lieu&&cfg.lieu.nom;$("#report-kicker").textContent=text().reportKicker;$("#report-title").textContent=doc.titre||"";$("#report-title").dataset.animated="0";const parts=(doc.texte||"").split(/\n\s*\n/).map(v=>v.trim()).filter(Boolean),conclusion=parts.length>=3?parts.pop():"";const body=$("#report-body");body.replaceChildren();parts.slice(0,2).forEach(value=>{const p=document.createElement("p");p.textContent=value;body.appendChild(p)});$("#report-conclusion").textContent=conclusion;$("#report-conclusion").hidden=!conclusion;$("#report-label").textContent=doc.label||"";const codeLine=$("#participant-code-line");if(participantCode){codeLine.innerHTML=`${text().participantCodeLabel} <b>${participantCode}</b><br>${text().participantCodeHint}`;codeLine.hidden=false}else codeLine.hidden=true;const lieuEl=$("#report-stub-lieu");if(lieuNom){lieuEl.innerHTML=`${text().reportBuzzerLabel}<b>${lieuNom}</b>`;lieuEl.hidden=false}else lieuEl.hidden=true;const finLocale=lang==="de"?"de-CH":"fr-CH",now=new Date();$("#report-stub-datetime").innerHTML=`${text().reportDateLabel}<b>${now.toLocaleDateString(finLocale,{day:"2-digit",month:"2-digit",year:"numeric"})} · ${now.toLocaleTimeString(finLocale,{hour:"2-digit",minute:"2-digit"})}</b>`;$("#report-thanks").textContent=text().reportThanks;$("#report-card").hidden=false;void $("#report-card").offsetWidth;$("#report-card").classList.add("reveal");animateWords($("#e-report"));horn();musicStop();later(40000,returnWaiting)}
function returnWaiting(){clearTimers();stopSpeech();musicHardMuted=false;musicStop();state="waiting";session=null;participantCode=null;hideChrome();show("e-waiting")}

/* ================================================================
   Gestionnaire central de pression — buzzer physique, Space, Enter,
   buzzer à l'écran et tactile de secours partagent EXACTEMENT la même
   logique. Corrige le bug historique de double déclenchement Space/
   appui long: les boutons natifs (<button>) activaient AUSSI un clic
   natif au clavier (focus + Space/Enter), en plus de nos propres
   gestionnaires — deux actions au lieu d'une. Fix: tous les boutons
   générés restent hors du parcours de tabulation (tabindex="-1"), donc
   ne peuvent plus être "activés" nativement; Space/Enter ne sont
   interprétés qu'ICI, une seule fois, sur relâchement.

   Règles: appui court (<650 ms) = suivant. Appui long (>=650 ms) =
   valider au relâchement. Appui très long (>=4000 ms) = confirmation
   d'abandon. keydown: preventDefault + repeat ignoré + aucune validation
   directe. keyup: une seule action calculée sur la durée réelle. Reset
   sur blur, visibilitychange, pointercancel et changement d'écran. */
const LONG_PRESS=650,STOP_PRESS=4000;
let pressStarted=0,pressHeld=false,thresholdReached=false,holdRAF=0,transitioning=false;
let helpChooseMode=false,pendingFirstHint=false,firstQuestionExplained=false;
const ABORTABLE=new Set(["choice","stars","scale","compare","concept","reaction","voice-intro","voice-recording","voice-review"]);
let preAbortState=null,preAbortScreen=null;
const soundReady=()=>tone([950],.09,.1);

function pressVisual(on){$("#main-buzzer").classList.toggle("pressed",on)}
function armVisuals(){$("#interaction-dot").classList.add("arming");$("#press-meter").classList.add("on")}
function disarmVisuals(){$("#interaction-dot").classList.remove("arming");$("#press-meter").classList.remove("on","ready");$("#press-meter i").style.width="0%";document.querySelectorAll(".hold-fill").forEach(el=>el.style.width="0%");cancelAnimationFrame(holdRAF)}
function setMeter(pct){$("#press-meter i").style.width=Math.max(0,Math.min(100,pct))+"%"}

function holdLoop(){
 if(!pressHeld)return;
 const elapsed=Date.now()-pressStarted;
 const pct=Math.max(0,Math.min(100,elapsed/LONG_PRESS*100));
 setMeter(pct);
 const selectedFill=document.querySelector(".screen.active .choice.selected .hold-fill,.screen.active .reaction.selected .hold-fill");
 if(selectedFill)selectedFill.style.width=pct+"%";
 if(elapsed>=LONG_PRESS&&!thresholdReached){
  thresholdReached=true;$("#press-meter").classList.add("ready");soundReady();
  if(helpChooseMode)helpText(text().pressReady);
 }
 holdRAF=requestAnimationFrame(holdLoop);
}

/* Point d'entrée unique pour TOUTE source d'appui (buzzer, Space, Enter, tactile). */
function pressDown(){
 unlockSpeech();
 if(pressHeld)return; // ignore un second "down" tant que le premier n'est pas relâché
 pressHeld=true;pressStarted=Date.now();thresholdReached=false;
 pressVisual(true);armVisuals();resetIdle();
 if(helpChooseMode)helpText(text().pressHolding);
 holdRAF=requestAnimationFrame(holdLoop);
}
/* directTap: le geste a démarré directement sur une carte reconnaissable
   (choix, étoile, échelle, duel…) — elle a déjà été sélectionnée au posé du
   doigt, donc un relâchement court ne doit pas en plus faire défiler vers la
   suivante. Un relâchement long valide toujours, comme partout ailleurs. */
function pressUp(directTap){
 if(!pressHeld)return;
 const duration=Date.now()-pressStarted;
 pressHeld=false;pressStarted=0;pressVisual(false);disarmVisuals();
 if(helpChooseMode)helpText(pendingFirstHint?text().firstQuestionHint:text().pressIdle);
 if(transitioning)return; // une transition d'écran est en cours: ignorer, jamais de double validation
 if(duration>=STOP_PRESS&&ABORTABLE.has(state))return openStopConfirm();
 if(duration>=LONG_PRESS)return longPress();
 if(directTap)return;
 shortPress();
}
/* Remise à zéro sans exécuter d'action: perte de focus, onglet caché,
   pointeur annulé, ou changement d'écran en cours. */
function resetPress(){
 if(!pressHeld){cancelAnimationFrame(holdRAF);return}
 pressHeld=false;pressStarted=0;pressVisual(false);disarmVisuals();
 if(helpChooseMode)helpText(text().pressIdle);
}

function shortPress(){resetIdle();if(state==="waiting")return start();if(state==="intro")return showConsent();if(state==="concept")return showStep();if(state==="report"||state==="refused"||state==="mic-unavailable")return returnWaiting();if(state==="language"||state==="consent"||state==="choice"||state==="stop-confirm")return nextSelection(state==="language"?"#language-choices .choice":state==="consent"?"#consent-choices .choice":state==="stop-confirm"?"#stop-confirm-choices .choice":"#choice-options .choice");if(state==="stars")return nextStars();if(state==="reaction")return nextReaction();if(state==="scale")return nextScale();if(state==="compare")return nextCompare();if(state==="voice-intro")return startRecording();if(state==="voice-recording")return stopRecording();if(state==="voice-review")return nextSelection("#voice-review .choice")}
function longPress(){resetIdle();if(["waiting","intro","concept","report","refused","mic-unavailable","voice-intro","voice-recording"].includes(state))return shortPress();validateCurrent()}
function validateCurrent(){if(state==="language")return chooseLanguage();if(state==="consent")return consentChoice();if(state==="choice")return validateChoice();if(state==="stars")return validateStars();if(state==="reaction")return validateReaction();if(state==="scale")return validateScale();if(state==="compare")return validateCompare();if(state==="voice-review")return reviewAction();if(state==="stop-confirm")return stopConfirmChoice()}

/* "Tu peux arrêter à tout moment": appui de 4 s pendant le parcours. */
function openStopConfirm(){clearTimers();if(state==="voice-recording"){try{recorder&&recorder.state!=="inactive"&&recorder.stop()}catch{}voiceStream&&voiceStream.getTracks().forEach(t=>t.stop())}preAbortState=state;const active=document.querySelector(".screen.active");preAbortScreen=active?active.id:"e-waiting";state="stop-confirm";renderChoices($("#stop-confirm-choices"),[text().stopContinue,text().stopDelete],0);show("e-stop-confirm");setHelpChoose()}
function stopConfirmChoice(){if(selection===1)return confirmStopDelete();state=preAbortState;show(preAbortScreen);if(preAbortState==="voice-recording"||preAbortState==="voice-review"){state="voice-intro";$("#voice-meter").hidden=true;$("#voice-timer").hidden=true;$("#voice-review").hidden=true;$("#voice-status").textContent=text().recordStart;show("e-voice")}if(state==="voice-intro"||state==="concept")setHelp(text().press);else setHelpChoose()}
async function confirmStopDelete(){state="sending";clearTimers();stopSpeech();musicStop();await abandonnerSession();returnWaiting()}

/* Entrées: le clavier Espace/Entrée représente le buzzer physique. Sur
   mobile/tactile (iPhone compris), TOUT l'écran est le buzzer: un tap court
   n'importe où équivaut à un appui court, un tap maintenu équivaut à un
   appui long — même geste, même seuils, même code que le buzzer physique et
   Space/Entrée. Seul le lien réel "Protection des données" (une vraie
   navigation) est exclu de cette capture.

   En plus de ça, le tactile permet aussi de toucher directement une carte
   précise (réponse, étoile, valeur d'échelle, duel…) pour la sélectionner
   tout de suite — plus naturel au doigt qu'un simple défilement. Un tap
   court dessus la sélectionne (sans valider); un tap maintenu dessus la
   sélectionne ET valide, comme partout ailleurs. */
function directTapSelect(target){
 const btn=target.closest(".choice");
 if(btn&&btn.parentElement&&btn.parentElement.id){
  const idx=[...btn.parentElement.children].indexOf(btn);
  if(idx>=0&&idx!==selection){selection=idx;refreshSelection("#"+btn.parentElement.id+" .choice");soundMove()}
  return true;
 }
 const star=target.closest(".star");
 if(star){
  const idx=[...star.parentElement.children].indexOf(star);
  if(idx>=0){currentStars=idx+1;refreshStars();soundMove()}
  return true;
 }
 const scaleBtn=target.closest(".scale-value");
 if(scaleBtn){
  const idx=[...scaleBtn.parentElement.children].indexOf(scaleBtn);
  if(idx>=0){currentScale=idx;refreshScale();soundMove()}
  return true;
 }
 const reactionBtn=target.closest(".reaction");
 if(reactionBtn){
  const idx=[...reactionBtn.parentElement.children].indexOf(reactionBtn);
  if(idx>=0){currentReaction=idx+1;refreshReaction();soundMove()}
  return true;
 }
 if(target.closest("#compare-a")){if(currentCompare!==0){currentCompare=0;refreshCompare();soundMove()}return true}
 if(target.closest("#compare-b")){if(currentCompare!==1){currentCompare=1;refreshCompare();soundMove()}return true}
 return false;
}
document.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="Enter")&&!e.repeat){e.preventDefault();pressDown()}});
document.addEventListener("keyup",e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();pressUp()}});
let pressIgnoredGesture=false,pressDirectTap=false;
document.addEventListener("pointerdown",e=>{
 pressIgnoredGesture=!!e.target.closest(".privacy-card");
 if(pressIgnoredGesture)return;
 e.preventDefault();
 pressDirectTap=directTapSelect(e.target);
 pressDown();
});
document.addEventListener("pointerup",e=>{
 if(pressIgnoredGesture){pressIgnoredGesture=false;return}
 e.preventDefault();
 const directTap=pressDirectTap;pressDirectTap=false;
 pressUp(directTap);
});
document.addEventListener("pointercancel",()=>{pressIgnoredGesture=false;pressDirectTap=false;resetPress()});
window.addEventListener("blur",resetPress);
document.addEventListener("visibilitychange",()=>{if(document.hidden)resetPress()});

function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(!["waiting","voice-recording","report"].includes(state))returnWaiting()},120000)}
resetIdle();animateWords($("#e-waiting"));
</script>
